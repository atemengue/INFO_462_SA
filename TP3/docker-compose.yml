version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SUPERUSER_USERNAME: "admin"
      DJANGO_SUPERUSER_EMAIL: "admin@mail.com"
      DJANGO_SUPERUSER_PASSWORD: "admin"
    


volumes:
  sqlite_data:
    driver: local
